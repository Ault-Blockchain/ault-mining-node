# fly.toml app configuration file generated for ault-miner on 2026-01-02T20:53:03-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ault-miner'
primary_region = 'nrt'

[build]
image = "ghcr.io/ault-blockchain/aultmined:v0.0.1-beta.13"

[env]
CHAIN_GRPC = 'test-grpc.cloud.aultblockchain.xyz:9090'
CHAIN_ID = 'ault_10904-1'
CHAIN_RPC = 'https://test-rpc.cloud.aultblockchain.xyz'
MINER_API_PORT = '8080'
MINER_DATA_DIR = '/data'

[[mounts]]
source = 'miner_data'
destination = '/data'
initial_size = '4gb'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = '30s'
timeout = '10s'
grace_period = '1m0s'
method = 'GET'
path = '/health'

[[vm]]
memory = '1gb'
cpus = 2
memory_mb = 1024
